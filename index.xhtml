<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Reservation Hotel Room</title>
    <link rel="stylesheet" href="index.css" type="text/css" media="screen" />
</head>
<body>

    <h1>Reservation Hotel Room</h1>

    <form action="" method="post">
        
        <fieldset>
            <legend>Personal Data</legend><br />
            <div class="form-row">
                <label for="name">1. Name</label><br />
                <input type="text" id="name" name="name" />
            </div><br />
            <div class="form-row">
                <label for="gender">2. Gender</label><br />
                <input type="text" id="gender" name="gender" />
            </div><br />
            <div class="form-row">
                <label for="email">3. Email Address</label><br />
                <input type="email" id="email" name="email" />
            </div><br />
            <div class="form-row">
                <label for="telp">4. Telp Number</label><br />
                <input type="text" id="telp" name="telp" />
            </div><br />
        </fieldset>

        <fieldset>
            <legend>Reservation Room form</legend><br />
            <div class="form-row">
                <label for="reserv_name">1. Reservation Name</label><br />
                <input type="text" id="reserv_name" name="reserv_name" />
            </div><br />
            <div class="form-row">
                <label for="booking_date">2. Booking date</label><br />
                <input type="text" id="booking_date" name="booking_date" />
            </div><br />
            <div class="form-row">
                <label for="room_type">3. Room Type</label><br />
                <select id="room_type" name="room_type">
                    <option value="Standard">Standard</option>
                    <option value="Deluxe">Deluxe</option>
                    <option value="Suite">Suite</option>
                </select>
            </div><br />
            <div class="form-row">
                <label for="bed_type">4. Bed Type</label><br />
                <select id="bed_type" name="bed_type">
                    <option value="Single Bed">Single Bed</option>
                    <option value="Double Bed">Double Bed</option>
                    <option value="Twin Bed">Twin Bed</option>
                </select>
            </div><br />
            <div class="form-row">
                <label>5. Breakfast</label><br />
                <input type="radio" id="with_breakfast" name="breakfast" value="With Breakfast" />
                <label for="with_breakfast" style="display: inline;">With Breakfast</label>
                <input type="radio" id="without_breakfast" name="breakfast" value="Without Breakfast" />
                <label for="without_breakfast" style="display: inline;">Without Breakfast</label>
            </div><br />
        </fieldset>

        <fieldset>
            <legend>Payment</legend><br />
            <div class="form-row">
                <label for="check_in">1. Check in date</label><br />
                <input type="text" id="check_in" name="check_in" />
            </div><br />
            <div class="form-row">
                <label for="check_out">2. Check out date</label><br />
                <input type="text" id="check_out" name="check_out" />
            </div><br />
            <div class="form-row">
                <label for="payment_method">3. Payment Method</label><br />
                <select id="payment_method" name="payment_method">
                    <option value="Cash">Cash</option>
                    <option value="Credit Card">Credit Card</option>
                    <option value="Transfer">Bank Transfer</option>
                </select>
            </div><br />
        </fieldset>
        
        <div style="padding: 10px;">
            <input type="submit" name="submit" value="submit" />
        </div>

    </form>

</body>

</html>
